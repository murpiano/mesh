# Builds both apps for a published release and attaches them to it: the signed Android APK
# and the Windows desktop app as one self-contained .exe. Run it by hand with a tag to
# rebuild the files of an existing release.
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: bash
        run: |
          version=${TAG#v}
          dotnet publish src/windows/Mesh.App/Mesh.App.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:Version="$version" -o publish
          mv publish/Mesh.App.exe "Mesh-$version-windows-x64.exe"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Mesh-*-windows-x64.exe --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MESH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export MESH_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$MESH_KEYSTORE"
          ./gradlew assembleRelease -PmeshVersion="${TAG#v}" --console=plain
          rm "$MESH_KEYSTORE"
          mv app/build/outputs/apk/release/app-release.apk "../Mesh-${TAG#v}-android.apk"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Mesh-*-android.apk --clobber
