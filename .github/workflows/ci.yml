# Builds and tests both apps: the Windows desktop app and the Android app. Releases are
# published only after this passes on master (see release.yml).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test src/windows/Mesh.sln
      - name: Build app
        run: dotnet build src/windows/Mesh.App/Mesh.App.csproj -c Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
